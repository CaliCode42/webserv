<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>404 Not Found</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1d23;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card {
    text-align: center;
    padding: 48px 56px;
    border: 1px solid #2e323b;
    border-radius: 12px;
    background: #21252d;
  }
  .code {
    font-size: 88px;
    font-weight: 700;
    margin: 0;
    color: #6ea8fe;
    letter-spacing: 2px;
  }
  .title {
    font-size: 20px;
    font-weight: 600;
    margin: 12px 0 8px;
  }
  .desc {
    font-size: 14px;
    color: #9aa0ab;
    margin: 0;
  }
  .foot {
    margin-top: 28px;
    font-size: 12px;
    color: #545a66;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <p class="title">Page introuvable</p>
    <p class="desc">La ressource demandée n'existe pas sur ce serveur.</p>
    <p class="foot">webserv/1.1</p>
  </div>
</body>
</html>
