server {
    listen 8080;
    root www;
	server_name first.local;

	error_page 404 /errors/404.html;
	error_page 405 /errors/405.html;
	error_page 413 /errors/413.html;

    location / {
        root www;
        allow_methods GET POST DELETE;
    }

    location /images {
        root www/images;
        allow_methods GET;
        autoindex on;
    }

    location /images/private {
        root www/private;
        allow_methods GET;
    }

    location /cgi {
        root www/cgi-bin/;
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php-cgi;
        cgi_extension .bad /path/does/not/exist;
    }
	
	location /foo {
		# no root
        allow_methods GET;
	}

	location /index_test {
		root www/index_test;
		index home.html;
		allow_methods GET;
	}

	location /old {
		redirect /new;
	}

	location /old302 {
		redirect 302 /new;
	}

	location /upload_test {
		root www;
		allow_methods POST;
		upload_enabled on;
		upload_path www/custom_uploads;
	}

	location /upload_disabled {
		root www;
		allow_methods POST;
		upload_enabled off;
	}
}

server {
    listen 8080;
    root www2;
	server_name second.local;

    location / {
        root www2;
        allow_methods GET POST;
    }
}

server {
	listen 8081;
	server_name third.local;
	root www3;

	location / {
		root www3;
		allow_methods GET POST;
	}
}