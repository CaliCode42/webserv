server {
    listen 8080;
    root www;
	server_name first.local;
	client_max_body_size 1000;

    location / {
        root www;
        allow_methods GET POST DELETE;
    }

    location /images {
        root www/images;
        allow_methods GET;
        autoindex on;
    }

    location /images/private {
        root www/private;
        allow_methods GET;
    }

    location /cgi {
        root www/cgi-bin/;
        allow_methods GET POST;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .php /usr/bin/php-cgi;
        cgi_extension .bad /path/does/not/exist;
    }
	
	location /foo {
		# no root
        allow_methods GET;
	}
}

server {
    listen 8080;
    root www2;
	server_name second.local;
	client_max_body_size 10;

    location / {
        root www2;
        allow_methods GET POST;
    }
}

server {
	listen 8081;
	server_name third.local;
	root www3;

	location / {
		root www3;
		allow_methods GET POST;
	}
}